<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hmida Sarbay media upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: rgba(24, 24, 27, 0.6);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --input-bg: rgba(0, 0, 0, 0.2);
            --glow-color: rgba(59, 130, 246, 0.15); /* Blue glow */
            
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        /* ---------------- LIGHT MODE OVERRIDES ---------------- */
        body.light {
            --bg-color: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.7);
            --panel-border: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.5);
            --glow-color: rgba(59, 130, 246, 0.1);
        }
        
        body.light header {
            background: rgba(248, 250, 252, 0.8);
        }
        
        body.light nav a:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        body.light .terminal-wrapper {
            background: #ffffff;
            border: 1px solid var(--panel-border);
        }
        
        body.light .terminal-header {
            background: #f1f5f9;
            border-bottom: 1px solid var(--panel-border);
        }

        body.light .output-content {
            color: #0f172a;
            background: #ffffff;
        }

        body.light .preview pre {
            background: rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Background glow effects */
        body::before {
            content: "";
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, var(--glow-color) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            transition: background 0.3s ease;
        }

        /* ---------------- NAVBAR ---------------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            position: sticky;
            top: 0;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent-blue);
            font-size: 0.9rem;
            padding: 4px 10px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 20px;
        }

        nav {
            display: flex;
            gap: 16px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            background: transparent;
            border: 1px solid transparent;
        }

        nav a:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--panel-border);
        }

        /* ---------------- MAIN LAYOUT ---------------- */
        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        /* ---------------- PANELS ---------------- */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease, border-color 0.3s ease;
        }

        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .panel-full {
            grid-column: 1 / -1;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .icon-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box.green { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); }
        .icon-box.red { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
        .icon-box.blue { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }

        /* ---------------- INPUTS & BUTTONS ---------------- */
        input[type="text"], input[type="file"] {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 12px 16px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        input[type="text"]::placeholder {
            color: #52525b;
        }

        input[type="file"]::file-selector-button {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--panel-border);
            padding: 8px 16px;
            border-radius: 6px;
            color: var(--text-main);
            cursor: pointer;
            margin-right: 16px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(255,255,255,0.15);
        }

        button {
            border: none;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            color: #fff;
        }

        .btn-green { background: var(--accent-green); }
        .btn-green:hover { background: var(--accent-green-hover); }

        .btn-red { background: var(--accent-red); }
        .btn-red:hover { background: var(--accent-red-hover); }

        .btn-blue { background: var(--accent-blue); }
        .btn-blue:hover { background: var(--accent-blue-hover); }

        /* ---------------- TERMINAL OUTPUT ---------------- */
        .terminal-wrapper {
            background: #000000;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: 10px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .terminal-header {
            background: #18181b;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--panel-border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .term-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .term-dot:nth-child(1) { background: #ff5f56; }
        .term-dot:nth-child(2) { background: #ffbd2e; }
        .term-dot:nth-child(3) { background: #27c93f; }

        .output-content {
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #a1a1aa;
            white-space: pre-wrap;
            line-height: 1.6;
            min-height: 120px;
            max-height: 300px;
            overflow-y: auto;
            transition: color 0.3s ease;
        }

        /* ---------------- PREVIEW ---------------- */
        .preview {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
        }

        .preview img, .preview video {
            max-width: 100%;
            max-height: 500px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 24px;
        }

        .preview audio {
            width: 100%;
            margin-top: 24px;
            border-radius: 30px;
        }
        
        .preview pre {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            padding: 16px;
            border-radius: 8px;
            width: 100%;
            overflow-x: auto;
            transition: background 0.3s ease, color 0.3s ease;
        }

        @media(max-width: 768px) {
            header {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="var(--accent-blue)"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            Hmida Sarbay <span>Media Workspace</span>
        </div>
        <nav>
            <a href="/cgi">CGI TEST</a>
            <a href="/cookies">COOKIES TEST</a>
        </nav>
    </header>

    <main>
        <div class="controls-grid">
            <!-- UPLOAD -->
            <div class="panel panel-full">
                <div class="panel-header">
                    <div class="icon-box green">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </div>
                    Upload Multipart Form-Data
                </div>
                <input type="file" id="file" multiple>
                <button class="btn-green" onclick="upload()">Execute Upload</button>
            </div>

            <!-- DELETE -->
            <div class="panel">
                <div class="panel-header">
                    <div class="icon-box red">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </div>
                    Delete File
                </div>
                <input type="text" id="del" placeholder="Enter filename (e.g., example.png)">
                <button class="btn-red" onclick="del()">Execute Delete</button>
            </div>

            <!-- GET -->
            <div class="panel">
                <div class="panel-header">
                    <div class="icon-box blue">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </div>
                    Fetch File
                </div>
                <input type="text" id="get" placeholder="Enter filename (e.g., example.png)">
                <button class="btn-blue" onclick="getFile()">Execute Fetch</button>
            </div>
        </div>

        <!-- OUTPUT -->
        <div class="terminal-wrapper">
            <div class="terminal-header">
                <div class="term-dot"></div>
                <div class="term-dot"></div>
                <div class="term-dot"></div>
            </div>
            <div id="out" class="output-content">System ready. Waiting for instructions...</div>
        </div>
        
        <div class="preview" id="preview"></div>
    </main>

    <!-- CORE SCRIPT -->
    <script>
    /* ---------------- THEME COOKIE TRACKING ---------------- */
    function getCookie(name) {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            let cookie = cookies[i].trim();
            if (cookie.indexOf(name + "=") === 0)
                return cookie.substring(name.length + 1);
        }
        return null;
    }

    function applyTheme(theme) {
        if (theme === "light")
            document.body.classList.add("light");
        else
            document.body.classList.remove("light");
    }

    window.addEventListener('load', function() {
        const savedTheme = getCookie("theme");
        if (savedTheme) {
            applyTheme(savedTheme);
        }
    });

    /* ---------------- HELPERS ---------------- */
    function log(text){
        document.getElementById("out").textContent = text;
    }
    function clearPreview(){
        document.getElementById("preview").innerHTML = "";
    }

    /* ---------------- UPLOAD (MULTIPART MULTIPLE) ---------------- */
    function upload(){
        clearPreview();
        const fileInput = document.getElementById("file");
        const files = fileInput.files;

        if (!files || files.length === 0) return log("no files selected");

        const formData = new FormData();
        // Loop through all selected files and add them to FormData
        for (let i = 0; i < files.length; i++) {
            formData.append("files", files[i], files[i].name);
        }

        log(`Uploading ${files.length} file(s)...`);

        fetch("/upload", {
            method: "POST",
            // Do NOT set "Content-Type" manually — browser sets the boundary automatically
            body: formData
        })
        .then(async response => {
            const locationHeader = response.headers.get("Location") || "None";
            const bodyText = await response.text();
            
            log(
                "UPLOAD RESPONSE:\n" +
                "STATUS: " + response.status + " " + response.statusText + "\n" +
                "LOCATION: " + locationHeader + "\n" +
                "BODY: " + (bodyText ? "\n" + bodyText : "(empty body)")
            );
        })
        .catch(e => log("ERROR:\n" + e));
    }

    /* ---------------- DELETE ---------------- */
    function del(){
        clearPreview();
        const name = document.getElementById("del").value;
        if (!name) return log("no filename");

        fetch("/upload/" + name, {
            method: "DELETE"
        })
        .then(async response => {
            const bodyText = await response.text();
            log(
                "DELETE RESPONSE:\n" +
                "STATUS: " + response.status + " " + response.statusText + "\n" +
                "BODY: " + (bodyText ? "\n" + bodyText : "(empty body)")
            );
        })
        .catch(e => log("ERROR:\n" + e));
    }

    /* ---------------- GET + PREVIEW ---------------- */
    function getFile(){
        clearPreview();
        const name = document.getElementById("get").value;
        if (!name) return log("no filename");

        fetch("/upload/" + name)
        .then(response => {
            if (!response.ok) throw new Error("HTTP " + response.status + " " + response.statusText);
            return response.blob();
        })
        .then(blob => {
            log(
                "GET RESPONSE:\n" +
                "SIZE: " + blob.size + " bytes\n" +
                "TYPE: " + (blob.type || "unknown")
            );

            const url = URL.createObjectURL(blob);
            const preview = document.getElementById("preview");

            /* IMAGE */
            if (blob.type.startsWith("image/")) {
                const img = document.createElement("img");
                img.src = url;
                preview.appendChild(img);
            }
            /* VIDEO */
            else if (blob.type.startsWith("video/")) {
                const video = document.createElement("video");
                video.src = url;
                video.controls = true;
                preview.appendChild(video);
            }
            /* AUDIO */
            else if (blob.type.startsWith("audio/")) {
                const audio = document.createElement("audio");
                audio.src = url;
                audio.controls = true;
                preview.appendChild(audio);
            }
            /* TEXT / CODE */
            else if (
                blob.type.startsWith("text/") || 
                blob.type.includes("json") || 
                blob.type.includes("javascript")
            ) {
                blob.text().then(text => {
                    const pre = document.createElement("pre");
                    pre.style.marginTop = "20px";
                    pre.style.whiteSpace = "pre-wrap";
                    pre.textContent = text;
                    preview.appendChild(pre);
                });
            }
        })
        .catch(e => log("ERROR:\n" + e));
    }
    </script>
</body>
</html>
