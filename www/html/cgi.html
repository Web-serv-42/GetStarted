<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGI Tester</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#0d0d0d;
  --panel:#141414;
  --border:#2a2a2a;
  --text:#e8e8e8;
  --muted:#666;
  --green:#00ff88;
  --blue:#4d9fff;
  --red:#ff3b3b;

  --mono:'Space Mono', monospace;
  --sans:'IBM Plex Sans', sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  padding:32px 24px;
}

/* ---------------- NAVBAR ---------------- */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding-bottom:20px;
  margin-bottom:40px;

  border-bottom:1px solid var(--border);
}

.logo{
  font-family:var(--mono);
  color:var(--green);
  font-size:1rem;
  letter-spacing:0.05em;
}

.logo span{
  color:var(--muted);
}

nav a{
  text-decoration:none;
  color:var(--text);

  border:1px solid var(--border);

  padding:10px 14px;

  font-family:var(--mono);
  font-size:0.75rem;

  transition:0.15s;
}

nav a:hover{
  border-color:var(--green);
  color:var(--green);
}


h1 {
    margin-bottom: 20px;
}

.panel {
    border: 1px solid #333;
    padding: 20px;
    margin-bottom: 20px;
    background: #151515;
}

h2 {
    margin-top: 0;
    color: #00ff99;
}

.section {
    margin-bottom: 25px;
}

input,
textarea,
button {
    width: 100%;
    box-sizing: border-box;
    margin-top: 10px;
    padding: 10px;
    background: #111;
    color: white;
    border: 1px solid #444;
    font-family: monospace;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button {
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #00ff99;
    color: black;
}

#result {
    border: 1px solid #333;
    background: black;
    color: #00ff99;
    padding: 15px;
    white-space: pre-wrap;
    min-height: 200px;
    overflow-x: auto;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    nginx-1.29.6 <span>/ media tester</span>
  </div>

  <nav>
    <a href="/">Home</a>
    <a href="/cookies/">COOKIES TEST</a>
  </nav>

</header>


<h1>CGI Tester</h1>

<!-- CGI MANAGEMENT -->
<div class="panel">
    <h2>CGI Management</h2>

    <!-- Upload CGI -->
    <div class="section">
        <h3>Upload CGI</h3>

        <input type="file" id="uploadFile" accept=".py,.php">
        <button onclick="uploadCGI()">Upload</button>
    </div>

    <!-- Delete CGI -->
    <div class="section">
        <h3>Delete CGI</h3>

        <input type="text" id="deleteFilename" placeholder="example.py">
        <button onclick="deleteCGI()">Delete</button>
    </div>
</div>

<!-- RUN CGI -->
<div class="panel">
    <h2>Run CGI</h2>

    <!-- GET -->
    <div class="section">
        <h3>Run CGI GET</h3>

        <input type="text" id="getFilename" placeholder="example.py">
        <button onclick="runGET()">Run GET</button>
    </div>

    <!-- POST -->
    <div class="section">
        <h3>Run CGI POST</h3>

        <input type="text" id="postFilename" placeholder="example.py">

        <textarea id="postBody" placeholder="Write body text here..."></textarea>

        <input type="file" id="postFile">

        <button onclick="runPOST()">Run POST</button>
    </div>
</div>

<!-- RESULT -->
<div class="panel">
    <h2>Result</h2>

    <div id="result">Waiting for request...</div>
</div>

<script>
const resultBox = document.getElementById("result");

function showResult(text) {
    resultBox.textContent = text;
}

// =========================
// Upload CGI
// =========================
async function uploadCGI() {
    const fileInput = document.getElementById("uploadFile");
    const file = fileInput.files[0];

    if (!file) {
        showResult("Please select a file.");
        return;
    }

    let contentType = "";

    if (file.name.endsWith(".py")) {
        contentType = "text/x-python";
    }
    else if (file.name.endsWith(".php")) {
        contentType = "application/x-httpd-php";
    }
    else {
        showResult("Only .py and .php files are allowed.");
        return;
    }

    try {
        const response = await fetch("/cgi-bin", {
            method: "POST",
            headers: {
                "Content-Type": contentType,
                "X-Filename": file.name
            },
            body: file
        });

        const text = await response.text();

        showResult(
            "UPLOAD CGI\n" +
            "Status: " + response.status + "\n" +
            "Content-Type: " + contentType + "\n\n" +
            text
        );
    }
    catch (error) {
        showResult("Upload failed:\n" + error);
    }
}

// =========================
// Delete CGI
// =========================
async function deleteCGI() {
    const filename = document.getElementById("deleteFilename").value.trim();

    if (!filename) {
        showResult("Please enter a filename.");
        return;
    }

    try {
        const response = await fetch("/cgi-bin/" + filename, {
            method: "DELETE"
        });

        const text = await response.text();

        showResult(
            "DELETE CGI\n" +
            "Status: " + response.status + "\n\n" +
            text
        );
    }
    catch (error) {
        showResult("Delete failed:\n" + error);
    }
}

// =========================
// Run CGI GET
// =========================
async function runGET() {
    const filename = document.getElementById("getFilename").value.trim();

    if (!filename) {
        showResult("Please enter a filename.");
        return;
    }

    try {
        const response = await fetch("/cgi-bin/" + filename);

        const text = await response.text();

        showResult(
            "RUN CGI GET\n" +
            "Status: " + response.status + "\n\n" +
            text
        );
    }
    catch (error) {
        showResult("GET request failed:\n" + error);
    }
}

// =========================
// Run CGI POST
// =========================
async function runPOST() {
    const filename = document.getElementById("postFilename").value.trim();
    const bodyText = document.getElementById("postBody").value;
    const fileInput = document.getElementById("postFile");

    if (!filename) {
        showResult("Please enter a filename.");
        return;
    }

    let body = "";

    // If file selected -> use file content
    if (fileInput.files.length > 0) {
        body = await fileInput.files[0].text();
    }
    // Else use textarea content
    else {
        body = bodyText;
    }

    try {
        const response = await fetch("/cgi-bin/" + filename, {
            method: "POST",
            body: body
        });

        const text = await response.text();

        showResult(
            "RUN CGI POST\n" +
            "Status: " + response.status + "\n\n" +
            text
        );
    }
    catch (error) {
        showResult("POST request failed:\n" + error);
    }
}
</script>

</body>
</html>
