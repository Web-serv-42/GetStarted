<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Webserv Cookie Test</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ---------------- NAVBAR ---------------- */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding-bottom:20px;
  margin-bottom:40px;

  border-bottom:1px solid var(--border);
}

.logo{
  font-family:var(--mono);
  color:var(--green);
  font-size:1rem;
  letter-spacing:0.05em;
}

.logo span{
  color:var(--muted);
}

nav a{
  text-decoration:none;
  color:var(--text);

  border:1px solid var(--border);

  padding:10px 14px;

  font-family:var(--mono);
  font-size:0.75rem;

  transition:0.15s;
}

nav a:hover{
  border-color:var(--green);
  color:var(--green);
}

:root {
  --bg:      #0d0d0d;
  --panel:   #141414;
  --border:  #2a2a2a;
  --accent:  #00ff88;
  --accent2: #ff6b35;
  --accent3: #4d9fff;
  --text:    #e8e8e8;
  --muted:   #555;
  --mono:    'Space Mono', monospace;
  --sans:    'IBM Plex Sans', sans-serif;
  --green:#00ff88;
  --blue:#4d9fff;
  --red:#ff3b3b;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  padding: 40px 24px;
  transition: background 0.2s, color 0.2s;
}


body.light {
  --bg: #f2f2f2;
  --panel: #ffffff;
  --border: #d0d0d0;
  --text: #111;
  --muted: #777;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 48px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-family: var(--mono);
  font-size: 1.1rem;
  color: var(--accent);
  letter-spacing: 0.05em;
}

h1 span {
  color: var(--muted);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  max-width: 960px;
  margin: 0 auto;
}

@media (max-width: 680px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.panel-label {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
}

.panel-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}

.dot-green  { background: var(--accent); }
.dot-blue   { background: var(--accent3); }
.dot-orange { background: var(--accent2); }

label {
  font-size: 0.72rem;
  color: var(--muted);
  font-family: var(--mono);
  letter-spacing: 0.05em;
}

select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  padding: 10px 12px;
  outline: none;
}

.btn {
  padding: 10px;
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  width: 100%;
  transition: opacity 0.15s;
}

.btn:hover {
  opacity: 0.85;
}

.btn-green {
  background: var(--accent);
  color: #000;
}

.btn-blue {
  background: var(--accent3);
  color: #000;
}

.btn-red {
  background: #ff3b3b;
  color: #fff;
}

.msg {
  font-family: var(--mono);
  font-size: 0.72rem;
  padding: 10px 12px;
  border-left: 2px solid;
  min-height: 40px;
}

.cookie-box {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 14px;
  font-family: var(--mono);
  font-size: 0.75rem;
  word-break: break-word;
  line-height: 1.7;
}

</style>
</head>
<body>

<header>

  <div class="logo">
    Hmida Sarbay <span>/ media tester</span>
  </div>

  <nav>
    <a href="/">Home</a>
    <a href="/cgi/">CGI TEST</a>
  </nav>

</header>

<div class="grid">

  <!-- Theme Panel -->
  <div class="panel">

    <div class="panel-label">
      <span class="dot dot-green"></span>
      theme cookie
    </div>

    <label for="theme">SELECT THEME</label>

    <select id="theme">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>

    <button class="btn btn-green" onclick="saveTheme()">
      Save Theme Cookie
    </button>

  </div>

  <!-- Language Panel -->
  <div class="panel">

    <div class="panel-label">
      <span class="dot dot-blue"></span>
      language cookie
    </div>

    <label for="language">SELECT LANGUAGE</label>

    <select id="language">
      <option value="english">English</option>
      <option value="french">French</option>
      <option value="arabic">Arabic</option>
      <option value="spanish">Spanish</option>
    </select>

    <button class="btn btn-blue" onclick="saveLanguage()">
      Save Language Cookie
    </button>

  </div>

  <!-- Cookie Output -->
  <div class="panel" style="grid-column: 1 / -1;">

    <div class="panel-label">
      <span class="dot dot-orange"></span>
      stored cookies
    </div>

    <div class="cookie-box" id="cookieOutput">
      No cookies yet.
    </div>

    <button class="btn btn-red" onclick="clearCookies()">
      Delete Cookies
    </button>

  </div>

</div>

<script>

function setCookie(name, value, days)
{
  let expires = "";

  if (days)
  {
    const date = new Date();
    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
    expires = "; expires=" + date.toUTCString();
  }

  document.cookie = name + "=" + value + expires + "; path=/";
}

function getCookie(name)
{
  const cookies = document.cookie.split(';');

  for (let i = 0; i < cookies.length; i++)
  {
    let cookie = cookies[i].trim();

    if (cookie.indexOf(name + "=") === 0)
      return cookie.substring(name.length + 1);
  }

  return null;
}

function saveTheme()
{
  const theme = document.getElementById('theme').value;

  setCookie("theme", theme, 7);

  applyTheme(theme);

  updateCookies();

}

function saveLanguage()
{
  const language = document.getElementById('language').value;

  setCookie("language", language, 7);

  updateCookies();
}

function clearCookies()
{
  setCookie("theme", "", -1);
  setCookie("language", "", -1);

  updateCookies();

  document.body.classList.remove("light");

}

function updateCookies()
{
  const output = document.getElementById('cookieOutput');

  if (document.cookie.length === 0)
    output.innerHTML = "No cookies stored.";
  else
    output.innerHTML = document.cookie;
}


function applyTheme(theme)
{
  if (theme === "light")
    document.body.classList.add("light");
  else
    document.body.classList.remove("light");
}

window.onload = function()
{
  const savedTheme = getCookie("theme");
  const savedLanguage = getCookie("language");

  if (savedTheme)
  {
    document.getElementById('theme').value = savedTheme;
    applyTheme(savedTheme);
  }

  if (savedLanguage)
    document.getElementById('language').value = savedLanguage;

  updateCookies();

};

</script>

</body>
</html>
