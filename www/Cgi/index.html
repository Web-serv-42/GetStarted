<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGI Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: rgba(24, 24, 27, 0.6);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --input-bg: rgba(0, 0, 0, 0.2);
            --glow-color: rgba(168, 85, 247, 0.15); /* Purple glow */
            
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-purple: #a855f7;
            --accent-purple-hover: #9333ea;
            
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        /* ---------------- LIGHT MODE OVERRIDES ---------------- */
        body.light {
            --bg-color: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.7);
            --panel-border: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.5);
            --glow-color: rgba(168, 85, 247, 0.1);
        }
        
        body.light header {
            background: rgba(248, 250, 252, 0.8);
        }
        
        body.light nav a:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        body.light .terminal-wrapper {
            background: #ffffff;
            border: 1px solid var(--panel-border);
        }
        
        body.light .terminal-header {
            background: #f1f5f9;
            border-bottom: 1px solid var(--panel-border);
        }

        body.light .output-content {
            color: #0f172a;
            background: #ffffff;
        }

        body.light .btn-clear {
            background: rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Background glow effects */
        body::before {
            content: "";
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, var(--glow-color) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            transition: background 0.3s ease;
        }

        /* ---------------- NAVBAR ---------------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            position: sticky;
            top: 0;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent-purple);
            font-size: 0.9rem;
            padding: 4px 10px;
            background: rgba(168, 85, 247, 0.1);
            border-radius: 20px;
        }

        nav {
            display: flex;
            gap: 16px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            background: transparent;
            border: 1px solid transparent;
        }

        nav a:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--panel-border);
        }

        /* ---------------- MAIN LAYOUT ---------------- */
        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        /* ---------------- PANELS ---------------- */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease, border-color 0.3s ease;
        }

        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .panel-full {
            grid-column: 1 / -1;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            margin-bottom: 8px;
        }

        .icon-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box.green { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); }
        .icon-box.red { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
        .icon-box.blue { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }
        .icon-box.purple { background: rgba(168, 85, 247, 0.1); color: var(--accent-purple); }

        /* ---------------- INPUTS & BUTTONS ---------------- */
        input[type="text"], input[type="file"], textarea {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 12px 16px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }
        
        /* Container to align the file input and clear button */
        .file-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            flex: 1;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: #52525b;
        }

        input[type="file"]::file-selector-button {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--panel-border);
            padding: 8px 16px;
            border-radius: 6px;
            color: var(--text-main);
            cursor: pointer;
            margin-right: 16px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(255,255,255,0.15);
        }

        button {
            border: none;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            color: #fff;
            margin-top: auto;
        }

        .btn-green { background: var(--accent-green); }
        .btn-green:hover { background: var(--accent-green-hover); }

        .btn-red { background: var(--accent-red); }
        .btn-red:hover { background: var(--accent-red-hover); }

        .btn-blue { background: var(--accent-blue); }
        .btn-blue:hover { background: var(--accent-blue-hover); }
        
        .btn-purple { background: var(--accent-purple); }
        .btn-purple:hover { background: var(--accent-purple-hover); }

        /* Clear file selection button */
        .btn-clear {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 11px; 
            border-radius: 10px;
            margin-top: 0; /* Overrides global button styling */
            transition: all 0.2s ease;
        }
        
        .btn-clear:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* ---------------- TERMINAL OUTPUT ---------------- */
        .terminal-wrapper {
            background: #000000;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: 10px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .terminal-header {
            background: #18181b;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--panel-border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .term-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .term-dot:nth-child(1) { background: #ff5f56; }
        .term-dot:nth-child(2) { background: #ffbd2e; }
        .term-dot:nth-child(3) { background: #27c93f; }

        .output-content {
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-green);
            white-space: pre-wrap;
            line-height: 1.6;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
            transition: color 0.3s ease;
        }

        @media(max-width: 768px) {
            header {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="var(--accent-purple)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            Hmida Sarbay <span>CGI Workspace</span>
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/cookies/">COOKIES TEST</a>
        </nav>
    </header>

    <main>
        <h1 class="page-title">CGI Tester</h1>

        <div class="controls-grid">
            
            <!-- UPLOAD CGI -->
            <div class="panel">
                <div class="panel-header">
                    <div class="icon-box green">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </div>
                    Upload CGI Script
                </div>
                <div class="file-input-wrapper">
                    <input type="file" id="uploadFile" accept=".py,.php">
                    <button type="button" class="btn-clear" onclick="clearFile('uploadFile')" title="Clear selection">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <button class="btn-green" onclick="uploadCGI()">Upload</button>
            </div>

            <!-- DELETE CGI -->
            <div class="panel">
                <div class="panel-header">
                    <div class="icon-box red">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </div>
                    Delete CGI Script
                </div>
                <input type="text" id="deleteFilename" placeholder="example.py">
                <button class="btn-red" onclick="deleteCGI()">Delete</button>
            </div>

            <!-- RUN GET -->
            <div class="panel">
                <div class="panel-header">
                    <div class="icon-box blue">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                    Run CGI GET
                </div>
                <input type="text" id="getFilename" placeholder="example.py">
                <button class="btn-blue" onclick="runGET()">Run GET</button>
            </div>

            <!-- RUN POST -->
            <div class="panel panel-full">
                <div class="panel-header">
                    <div class="icon-box purple">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </div>
                    Run CGI POST
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;">
                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <input type="text" id="postFilename" placeholder="example.py (Target Script)">
                        <div class="file-input-wrapper">
                            <input type="file" id="postFile">
                            <button type="button" class="btn-clear" onclick="clearFile('postFile')" title="Clear selection">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                    </div>
                    <textarea id="postBody" placeholder="Write body text here..."></textarea>
                </div>
                <button class="btn-purple" onclick="runPOST()">Run POST</button>
            </div>
            
        </div>

        <!-- RESULT TERMINAL -->
        <div class="terminal-wrapper">
            <div class="terminal-header">
                <div class="term-dot"></div>
                <div class="term-dot"></div>
                <div class="term-dot"></div>
            </div>
            <div id="result" class="output-content">Waiting for request...</div>
        </div>

    </main>

<script>
/* ---------------- THEME COOKIE TRACKING ---------------- */
function getCookie(name) {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
        let cookie = cookies[i].trim();
        if (cookie.indexOf(name + "=") === 0)
            return cookie.substring(name.length + 1);
    }
    return null;
}

function applyTheme(theme) {
    if (theme === "light")
        document.body.classList.add("light");
    else
        document.body.classList.remove("light");
}

window.addEventListener('load', function() {
    const savedTheme = getCookie("theme");
    if (savedTheme) {
        applyTheme(savedTheme);
    }
});

/* ---------------- CORE LOGIC ---------------- */
const resultBox = document.getElementById("result");

function showResult(text) {
    resultBox.textContent = text;
}

// =========================
// Clear File Input
// =========================
function clearFile(inputId) {
    document.getElementById(inputId).value = "";
}

// =========================
// Upload CGI
// =========================
async function uploadCGI() {
    const fileInput = document.getElementById("uploadFile");
    const file = fileInput.files[0];

    if (!file) {
        showResult("Please select a file.");
        return;
    }

    // Strictly validate that it's a script file
    if (!file.name.endsWith(".py") && !file.name.endsWith(".php")) {
        showResult("Only .py and .php files are allowed.");
        return;
    }

    // Create a standard multi-part container
    const formData = new FormData();
    
    // "scriptFile" is the field name; your C++ multipart parser can read this key if needed
    formData.append("scriptFile", file, file.name);

    try {
        // Send POST directly to the execution/upload endpoint route
        const response = await fetch("/cgi-bin", {
            method: "POST",
            // NOTE: Do NOT set the 'Content-Type' header manually here.
            // Leaving it blank allows the browser to automatically generate 
            // 'multipart/form-data' along with the exact, unique boundary string.
            body: formData
        });

        const text = await response.text();

        showResult(
            "UPLOAD CGI\n" +
            "Status: " + response.status + "\n" +
            "Response:\n\n" + text
        );
    }
    catch (error) {
        showResult("Upload failed:\n" + error);
    }
}


// =========================
// Delete CGI
// =========================
async function deleteCGI() {
    const filename = document.getElementById("deleteFilename").value.trim();

    if (!filename) {
        showResult("Please enter a filename.");
        return;
    }

    try {
        const response = await fetch("/cgi-bin/" + filename, {
            method: "DELETE"
        });

        const text = await response.text();

        showResult(
            "DELETE CGI\n" +
            "Status: " + response.status + "\n\n" +
            text
        );
    }
    catch (error) {
        showResult("Delete failed:\n" + error);
    }
}

// =========================
// Run CGI GET
// =========================
async function runGET() {
    const filename = document.getElementById("getFilename").value.trim();

    if (!filename) {
        showResult("Please enter a filename.");
        return;
    }

    try {
        const response = await fetch("/cgi-bin/" + filename);

        const text = await response.text();

        showResult(
            "RUN CGI GET\n" +
            "Status: " + response.status + "\n\n" +
            text
        );
    }
    catch (error) {
        showResult("GET request failed:\n" + error);
    }
}

// =========================
// Run CGI POST
// =========================
async function runPOST() {
    const filename = document.getElementById("postFilename").value.trim();
    const bodyText = document.getElementById("postBody").value;
    const fileInput = document.getElementById("postFile");

    if (!filename) {
        showResult("Please enter a filename.");
        return;
    }

    let body = "";

    // If file selected -> use file content
    if (fileInput.files.length > 0) {
        body = await fileInput.files[0].text();
    }
    // Else use textarea content
    else {
        body = bodyText;
    }

    try {
        const response = await fetch("/cgi-bin/" + filename, {
            method: "POST",
            body: body
        });

        const text = await response.text();

        showResult(
            "RUN CGI POST\n" +
            "Status: " + response.status + "\n\n" +
            text
        );
    }
    catch (error) {
        showResult("POST request failed:\n" + error);
    }
}
</script>

</body>
</html>
