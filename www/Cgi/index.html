<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGI Script Tester</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 0.5rem;
        }
        textarea {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button.php-btn {
            background-color: #4f5b93;
        }
        button:hover {
            opacity: 0.9;
        }
        iframe {
            width: 100%;
            height: 250px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        .status {
            font-size: 0.9rem;
            margin-top: 0.5rem;
            color: #666;
        }
    </style>
</head>
<body>

    <h2>CGI Script Tester</h2>

    <div class="card">
        <label for="postData">POST Body / Text Input:</label>
        <textarea id="postData" rows="4" placeholder="Type text here to send to stdin / php://input...">Hello from CGI Test Page!</textarea>

        <div class="btn-group">
            <button onclick="runScript('index.py')">Run Python CGI</button>
            <button class="php-btn" onclick="runScript('index.php')">Run PHP CGI</button>
        </div>
        <div id="status" class="status">Ready</div>
    </div>

    <div class="card">
        <label>Execution Output (Rendered HTML):</label>
        <iframe id="outputFrame"></iframe>
    </div>

    <script>
        async function runScript(fileName) {
            const dataInput = document.getElementById('postData').value;
            const statusDiv = document.getElementById('status');
            const iframe = document.getElementById('outputFrame');

            // Targets /cgi-bin/ directly matching your server route config
            const targetUrl = `/cgi-bin/${fileName}`;

            statusDiv.textContent = `Sending POST request to ${targetUrl}...`;
            statusDiv.style.color = '#666';

            try {
                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain; charset=utf-8'
                    },
                    body: dataInput
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error ${response.status}: ${response.statusText}`);
                }

                const htmlResult = await response.text();
                
                // Render the received HTML inside the iframe
                iframe.srcdoc = htmlResult;
                statusDiv.textContent = `Success (${response.status} OK)`;
                statusDiv.style.color = 'green';

            } catch (err) {
                iframe.srcdoc = `<p style="color:red;"><b>Error:</b> ${err.message}</p>`;
                statusDiv.textContent = 'Execution failed.';
                statusDiv.style.color = 'red';
            }
        }
    </script>

</body>
</html>
