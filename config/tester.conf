server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./YoupiBanane; # Change to your global default root if needed

    # 1. / must answer to GET request ONLY
    location / {
        allow_methods GET POST;
        index index.html;
    }

    # 2. Any file with .bla extension must answer to POST by calling cgi_test
    location .bla {
        allow_methods POST;
		cgi .bla ./cgi-bin/cgi_test;
    }

    # 3. /post_body must answer to POST with a maxBody of 100
    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    # 4. /directory/ must answer to GET, root YoupiBanane, index youpi.bad_extension
    location /directory/ {
        allow_methods GET;
        root ./YoupiBanane; # Adjust path relative to where you run your binary
        index youpi.bad_extension;
    }
}