server
{
    listen 8080;
    server_name site1;

    root ./www/html;

    client_max_body_size 99999999;
    
    location /
    {
        autoindex off;
        allow_methods GET POST;
    } 

    location /downloads/ {
        root ./www/html;
        allow_methods GET POST DELETE;
        upload_file ./www/html;
        index h.html;
        autoindex on;
    }

    location /upload 
    {
        root    ./upload;
        upload_file ./upload;
        autoindex on;
    }

}   

